<body>
    <div class="hex-bg"></div>
    <div id="app">
        <div id="header">
            <h1>IAMAI HIVE</h1>
            <div id="stats">
                <span class="stat-card">🐝 <strong id="stat-interactions">0</strong></span>
                <span class="stat-card">⭐ <strong id="stat-rating">—</strong></span>
                <span class="stat-card">📦 <strong id="stat-patterns">0</strong></span>
                <span class="stat-card">💾 <strong id="stat-memory">0 KB</strong></span>
            </div>
        </div>
        <div id="chat"></div>
        <div id="history-panel"></div>
        <div class="bottom-bar">
            <button id="history-toggle" onclick="toggleHistory()">📜 History</button>
            <button id="compact-btn" onclick="compactNow()">🌀 Compact</button>
            <span style="flex:1;"></span>
            <span style="font-size:0.7rem; color:#664d33;">v2.0</span>
        </div>
        <div id="input-area">
            <input id="chat-input" placeholder="Ask the hive..." autofocus />
            <button id="send-btn">🍯 Send</button>
        </div>
    </div>
    <script>
        const API = window.location.origin;
        const chatEl = document.getElementById('chat');
        const inputEl = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        let historyVisible = false;

        const AGENT_COLORS = { tails: '#22d3a7', zonic: '#38bdf8', judge: '#fbbf24', deepseek: '#a855f7', scribe: '#e2e8f0' };
        const AGENT_ICONS = { tails: 'T', zonic: 'Z', judge: 'J', deepseek: 'D', scribe: 'S' };

        function addMessage(role, text, meta = {}) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            const agentKey = meta.agent || 'user';
            if (role === 'assistant' && agentKey && AGENT_ICONS[agentKey]) {
                avatar.textContent = AGENT_ICONS[agentKey];
                avatar.style.borderColor = AGENT_COLORS[agentKey] || '#ffb800';
                avatar.style.color = AGENT_COLORS[agentKey] || '#ffb800';
                avatar.style.background = '#1f160e';
            } else {
                avatar.textContent = '🐝';
                avatar.style.borderColor = '#ffb800';
                avatar.style.color = '#ffb800';
            }
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (role === 'assistant' && agentKey) {
                const name = document.createElement('div');
                name.className = 'agent-name';
                name.textContent = agentKey.toUpperCase();
                name.style.color = AGENT_COLORS[agentKey] || '#ffb800';
                bubble.appendChild(name);
            }
            const content = document.createElement('div');
            content.textContent = text;
            bubble.appendChild(content);
            if (role === 'assistant' && meta.id) {
                const metaDiv = document.createElement('div');
                metaDiv.className = 'meta';
                const rating = meta.rating || '—';
                metaDiv.innerHTML = `
                    <span>⭐ ${rating}</span>
                    <button class="feedback-btn" onclick="feedback(${meta.id}, 'up')">👍</button>
                    <button class="feedback-btn" onclick="feedback(${meta.id}, 'down')">👎</button>
                    ${meta.corrected ? `<span>✏️ ${meta.corrected}</span>` : ''}
                `;
                bubble.appendChild(metaDiv);
            }
            div.appendChild(avatar);
            div.appendChild(bubble);
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing';
            div.id = 'typing-indicator';
            div.textContent = '🐝 thinking...';
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        async function sendMessage() {
            const q = inputEl.value.trim();
            if (!q) return;
            inputEl.value = '';
            addMessage('user', q);
            showTyping();
            try {
                const res = await fetch(API + '/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: q })
                });
                const data = await res.json();
                hideTyping();
                if (data.response) {
                    const histRes = await fetch(API + '/history');
                    const hist = await histRes.json();
                    const latest = hist.length ? hist[0] : null;
                    const agentParts = data.agent_parts || {};
                    const agentKeys = ['tails', 'zonic', 'judge', 'deepseek', 'scribe'];
                    for (const key of agentKeys) {
                        if (agentParts[key]) {
                            addMessage('assistant', agentParts[key], { agent: key });
                            await new Promise(r => setTimeout(r, 200));
                        }
                    }
                    addMessage('assistant', data.response, {
                        id: latest ? latest.id : null,
                        rating: latest ? latest.rating : null,
                        corrected: latest ? latest.corrected : null,
                        agent: 'scribe'
                    });
                } else {
                    addMessage('assistant', '⚠️ No response');
                }
                updateStats();
                refreshChat();
                // 🔥 FIX: Refocus input after sending
                inputEl.focus();
            } catch (e) {
                hideTyping();
                addMessage('assistant', '❌ Error: ' + e.message);
                inputEl.focus();
            }
        }

        async function feedback(id, rating) {
            const res = await fetch(API + '/history');
            const hist = await res.json();
            const entry = hist.find(e => e.id === id);
            if (!entry) return;
            try {
                await fetch(API + '/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: entry.query, rating })
                });
                refreshChat();
                updateStats();
                inputEl.focus();
            } catch (e) {
                alert('Feedback error');
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch(API + '/history');
                const data = await res.json();
                const panel = document.getElementById('history-panel');
                panel.innerHTML = data.map(e =>
                    `<div class="history-entry">
                        <div class="hq">❓ ${e.query}</div>
                        <div class="ha">💬 ${e.final}</div>
                        <div class="hr">⭐ ${e.rating || '—'} ${e.corrected ? '✏️ '+e.corrected : ''}</div>
                    </div>`
                ).join('');
            } catch (e) {
                document.getElementById('history-panel').innerHTML = '⚠️ Could not load history.';
            }
        }

        function toggleHistory() {
            const panel = document.getElementById('history-panel');
            historyVisible = !historyVisible;
            panel.style.display = historyVisible ? 'block' : 'none';
            document.getElementById('history-toggle').textContent = historyVisible ? '📜 Hide History' : '📜 History';
            if (historyVisible) loadHistory();
        }

        async function refreshChat() {
            chatEl.innerHTML = '';
            const res = await fetch(API + '/history');
            const hist = await res.json();
            hist.reverse().forEach(e => {
                addMessage('user', e.query);
                let agentParts = {};
                try { agentParts = JSON.parse(e.agents || '{}'); } catch (_) {}
                const agentKeys = ['tails', 'zonic', 'judge', 'deepseek', 'scribe'];
                let hasAgentParts = false;
                for (const key of agentKeys) {
                    if (agentParts[key]) {
                        addMessage('assistant', agentParts[key], { agent: key });
                        hasAgentParts = true;
                    }
                }
                addMessage('assistant', e.final, { id: e.id, rating: e.rating, corrected: e.corrected, agent: 'scribe' });
            });
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        async function compactNow() {
            if (confirm('Compact memory now?')) {
                const res = await fetch(API + '/compact', { method: 'POST' });
                const data = await res.json();
                alert(data.status);
                refreshChat();
                updateStats();
                inputEl.focus();
            }
        }

        async function updateStats() {
            try {
                const res = await fetch(API + '/stats');
                const stats = await res.json();
                document.getElementById('stat-interactions').textContent = stats.interactions || 0;
                document.getElementById('stat-rating').textContent = stats.avg_rating || '—';
                document.getElementById('stat-patterns').textContent = stats.patterns || 0;
                document.getElementById('stat-memory').textContent = stats.memory || '0 KB';
            } catch (_) {}
        }

        window.onload = function() {
            refreshChat();
            updateStats();
            setInterval(updateStats, 30000);
            inputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
            });
            sendBtn.addEventListener('click', sendMessage);
            inputEl.focus();
        };
    </script>
</body>
</html>
