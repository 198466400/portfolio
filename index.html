<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>codedkota.com — Envy.Tech OS</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: black;
        font-family: Space Grotesk, sans-serif;
    }

    /* Cosmic Nebula Background */
    .nebula {
        position: fixed;
        top: 0; left: 0;
        width: 200%;
        height: 100%;
        background: url('https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3') repeat-x;
        background-size: cover;
        animation: drift 40s linear infinite alternate;
        filter: brightness(1.4) saturate(1.3);
    }

    @keyframes drift {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }

    /* Holographic HUD Frame */
    .hud {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 70vw;
        height: 60vh;
        border: 3px solid rgba(0,255,255,0.4);
        box-shadow: 0 0 25px rgba(0,255,255,0.8);
        backdrop-filter: blur(12px);
        border-radius: 22px;
    }

    /* Micro + Mega Service Nodes */
    .node {
        position: absolute;
        width: 22px; height: 22px;
        border-radius: 50%;
        background: rgba(0,255,255,0.8);
        box-shadow: 0 0 12px cyan;
        animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.6); opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
    }

    .mega {
        width: 120px; height: 120px;
        background: rgba(255,165,0,0.7);
        box-shadow: 0 0 40px orange;
    }
</style>
</head>

<body>
<div class="nebula"></div>

<div class="hud"></div>

<!-- Micro Service Nodes -->
<div class="node" style="top:20%; left:30%;"></div>
<div class="node" style="top:70%; left:60%;"></div>
<div class="node" style="top:40%; left:80%;"></div>

<!-- Mega Service Structure -->
<div class="node mega" style="top:50%; left:15%;"></div>

</body>
</html>
